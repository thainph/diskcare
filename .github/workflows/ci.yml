name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test (macOS, Apple silicon)
    runs-on: macos-15   # arm64 runner
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          uname -m

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: spm-${{ runner.os }}-${{ runner.arch }}-

      - name: Build
        run: swift build -c release --arch arm64

      - name: Test
        run: swift test

      - name: Bundle app (smoke test)
        run: |
          scripts/bundle-app.sh
          .build/DiskCare.app/Contents/Resources/diskcare --version
          .build/DiskCare.app/Contents/Resources/diskcare scan "$GITHUB_WORKSPACE" --no-git --no-record --top 3
